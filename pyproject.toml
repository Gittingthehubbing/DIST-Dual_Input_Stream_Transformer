[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dist-dual-input-stream-transformer"
version = "0.1.0"
description = "Dual Input Stream Transformer for eye-tracking line assignment"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "eye-tracking",
    "drift-correction",
    "transformer",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "datasets",
    "einops",
    "eyekit",
    "icecream",
    "jellyfish",
    "lovely-tensors",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "Pillow",
    "plotly",
    "pycairo",
    "pydantic",
    "pytorch-lightning",
    "PyYAML",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "timm",
    "torch>=2,<3",
    "torchmetrics",
    "torchvision",
    "tqdm",
    "transformers==4.39.*",
]

[project.optional-dependencies]

# Streamlit web application.
# A normal package installation does NOT install these.
app = [
    "streamlit",
    "stqdm",
]

# Additional dependencies needed for training workflows.
train = [
    "tensorboard",
]

# Interactive notebook environment.
notebook = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

# Everything an end user might want, excluding contributor/dev tooling.
full = [
    "streamlit",
    "stqdm",
    "tensorboard",
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

[dependency-groups]

# Contributor/test/build tooling.
# uv sync and uv run include the dev group by default.
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.12",
    "twine>=6",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Gittingthehubbing/DIST-Dual_Input_Stream_Transformer"
Repository = "https://github.com/Gittingthehubbing/DIST-Dual_Input_Stream_Transformer"
Paper = "https://arxiv.org/abs/2311.06095"

[project.scripts]
dist-app = "dist_dual_input_stream_transformer.cli:app"
dist-train = "dist_dual_input_stream_transformer.train:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dist_dual_input_stream_transformer = [
    "data/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]